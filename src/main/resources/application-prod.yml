spring:
  application:
    name: route-backend-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:route-elasticsearch}:${ELASTICSEARCH_PORT:9200}

  datasource:
    url: jdbc:mysql://${RELATION_DATABASE_HOST:mysql}:${RELATION_DATABASE_PORT:3306}/${RELATION_DATABASE_DATABASE:route}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${RELATION_DATABASE_USERNAME}
    password: ${RELATION_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO_PROD:validate}
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.route.backend: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 604800000

logstash:
  host: ${LOGSTASH_HOST:route-logstash}
  port: ${LOGSTASH_PORT:5000}

cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}
  domain: ${COOKIE_DOMAIN:}
  path: ${COOKIE_PATH:/}
